[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pysoc"
version = "0.1.0"
description = "The SOCRATES radiative transfer code, as configured in the Isca climate model, in PyTorch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "torch>=2.1"]

[project.optional-dependencies]
notebooks = ["matplotlib", "ipywidgets"]
test = ["pytest"]

[tool.setuptools]
packages = ["pysoc"]

[tool.setuptools.package-data]
pysoc = ["data/*.npz"]
